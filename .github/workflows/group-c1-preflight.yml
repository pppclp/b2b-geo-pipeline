name: Group C1 Pre-PR Preflight
on:
  push:
    branches: [fix/group-c1-backend-safety]
permissions:
  contents: read
jobs:
  verify-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Backend tests
        run: node --test tests/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Apps Script build
        run: npm run gas:build
