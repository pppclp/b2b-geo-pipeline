name: Verify Scoped UAT Branch

on:
  push:
    branches: [fix/uat-hardening-scoped-22d885c]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Tests
        run: node --test tests/*.test.mjs
