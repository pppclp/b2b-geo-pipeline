name: Verify Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build UI
        run: npm run build
      - name: Runtime Config + Net RC and Quick Action tests
        run: node --test tests/*.test.mjs
