# Builds the web app and publishes it to GitHub Pages on every push to main.
# Needs a repository variable VITE_GEO_API_URL (Settings → Secrets and variables →
# Actions → Variables) holding the Apps Script web app URL ending in /exec.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check backend URL
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
        run: |
          case "$VITE_GEO_API_URL" in
            */exec) echo "Backend: Apps Script" ;;
            *) echo "::error::Set repository variable VITE_GEO_API_URL to the Apps Script /exec URL"; exit 1 ;;
          esac
      - run: npm ci
      - name: Build
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
