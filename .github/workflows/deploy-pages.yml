# UAT UI-only hotfix cut from the LAST successfully published GitHub Pages commit.
# This temporary branch intentionally contains NONE of the unpublished backend/API changes.
# Fail closed if ANY non-allowlisted file was modified relative to the published baseline.
name: Deploy to GitHub Pages

on:
  push:
    branches: [release/ui-hotfix-pages57]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify backend-compatible release ancestry and frontend-only patch
        shell: bash
        run: |
          set -euo pipefail
          BASE="56b1166686c2376cdabca259f17389b04b84a021"
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE" HEAD)
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "::error::No hotfix changes to deploy"; exit 1
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              .github/workflows/deploy-pages.yml|index.html|tailwind.config.js|src/index.css|src/components/AuthLayout.jsx|src/pages/Dashboard.jsx|src/pages/Pipeline.jsx|src/lib/pipelineListFilters.js|src/lib/pipelineFilterUi.js|tests/pipelineCompactToolbar.test.mjs)
                echo "Approved UI hotfix: $file";;
              *)
                echo "::error::Unexpected source changed in UI-only release: $file"; exit 1;;
            esac
          done
          echo "Backend sources unchanged from successfully deployed Pages revision ${BASE:0:10}."
      - name: Confirm Apps Script backend URL configured
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
        run: |
          case "$VITE_GEO_API_URL" in
            */exec) echo "Existing Apps Script URL retained";;
            *) echo "::error::VITE_GEO_API_URL must be the existing Apps Script /exec URL"; exit 1;;
          esac
      - run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Run existing UAT regression tests
        run: node --test tests/*.test.mjs
      - name: Build UI hotfix
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
