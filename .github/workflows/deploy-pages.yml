# Controlled Pages release:
# - UI-only changes after the LAST SUCCESSFULLY DEPLOYED revision publish on push.
# - Backend/API/import/auth/data changes require one coordinated UAT verification.
# - The gate compares against the last published Pages SHA, not simply the prior
#   commit, so pending backend changes can never slip in with a later CSS edit.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'tailwind.config.js'
  workflow_dispatch:
    inputs:
      backend_verified:
        description: "Confirm matching Apps Script deployment and API contract were verified in UAT (needed for backend-changing releases)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      release_allowed: ${{ steps.gate.outputs.release_allowed }}
      release_mode: ${{ steps.gate.outputs.release_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assess changes since the last published Pages version
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BACKEND_VERIFIED: ${{ inputs.backend_verified }}
        run: node scripts/pages-release-gate.mjs

  build:
    needs: preflight
    if: needs.preflight.outputs.release_allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check backend URL is set
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
        run: |
          case "$VITE_GEO_API_URL" in
            */exec) echo "Backend: Apps Script" ;;
            *) echo "::error::Set repository variable VITE_GEO_API_URL to the verified Apps Script /exec URL"; exit 1 ;;
          esac
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run automated regression tests
        run: node --test tests/*.test.mjs
      - name: Build Frontend
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
