# Controlled UAT deployment. GitHub Pages is deployed only after the matching Apps Script release is verified.
# Needs a repository variable VITE_GEO_API_URL (Settings → Secrets and variables →
# Actions → Variables) holding the Apps Script web app URL ending in /exec.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      backend_verified:
        description: "I verified the matching Apps Script deployment and API contract in UAT"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require backend compatibility verification
        env:
          VERIFIED: ${{ inputs.backend_verified }}
        run: |
          if [ "$VERIFIED" != "true" ]; then echo "::error::Verify compatible Apps Script deployment before Pages release"; exit 1; fi
      - name: Check backend URL
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
        run: |
          case "$VITE_GEO_API_URL" in
            */exec) echo "Backend: Apps Script" ;;
            *) echo "::error::Set repository variable VITE_GEO_API_URL to the Apps Script /exec URL"; exit 1 ;;
          esac
      - run: npm ci
      - name: Build
        env:
          VITE_GEO_API_URL: ${{ vars.VITE_GEO_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
