name: Preflight Restore Pipeline Filters
on:
  push:
    branches: [revert/pipeline-filters-to-pre-25]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: UI build
        run: npm run build
      - name: Apps Script build
        run: npm run gas:build
