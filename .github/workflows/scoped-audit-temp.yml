name: Temporary Scoped Dependency Audit
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run audit fix without force; compare vulnerabilities
        run: |
          npm audit --json > audit-before.json || true
          npm audit fix --no-fund || true
          npm audit --json > audit-after.json || true
          node --input-type=module -e 'import fs from "node:fs"; for (const file of ["audit-before.json","audit-after.json"]) {const data=JSON.parse(fs.readFileSync(file)); console.log(file, JSON.stringify(data.metadata?.vulnerabilities||{}));}'
      - name: Commit dependency security updates to this PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile or dependency changes from npm audit fix"
          else
            git commit -m "B2: apply npm audit fix without force"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoped-npm-audit-results
          path: |
            audit-before.json
            audit-after.json
            package-lock.json
