name: Build Copy-Paste Code.gs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-codegs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Apps Script files
        run: npm run gas:build
      - name: Build single Code.gs
        run: node scripts/gas-singlefile.mjs
      - name: Upload latest generated single-file Code.gs
        uses: actions/upload-artifact@v4
        with:
          name: b2b-geo-pipeline-codegs
          path: apps-script/Code.gs
          if-no-files-found: error
          retention-days: 7
      - name: Emit Code.gs as base64 for retrieval
        run: |
          echo "CODE_GS_BASE64_BEGIN"
          base64 -w0 apps-script/Code.gs
          echo
          echo "CODE_GS_BASE64_END"
