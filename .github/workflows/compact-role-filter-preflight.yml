name: Compact Role Filters Pre-PR
on:
  push:
    branches: [feat/compact-role-aware-classic-filters]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: UI Build
        run: npm run build
      - name: Apps Script Build
        run: npm run gas:build
