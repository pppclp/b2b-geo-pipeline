name: Classic Dropdown Fix Preflight
on:
  push:
    branches: [fix/classic-dropdown-stable-select]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: node --test tests/*.test.mjs
      - name: Lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: GAS build
        run: npm run gas:build
