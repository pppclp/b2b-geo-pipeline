# ============================================================
# 17. ACCESS CONTROL (RUNTIME)
# The backend (local dev server now, Apps Script later) reads this
# section to decide which Excel / Google Sheet file + sheet backs each
# entity and which role may do what. Edit here — not in code.
#
# actions:
#   read    — list / get rows
#   create  — add rows
#   update  — edit rows
#   delete  — remove rows (master data should be deactivated instead)
#   import  — bulk import into the sheet
#   export  — download as Excel
#
# scope (opportunity-like sheets only):
#   all     — every row
#   region  — rows whose region_id is in the user's active User_Region rows
#             (Management with no User_Region rows = all)
#   own     — rows where owner_user_id or current_handler_user_id = user
# ============================================================

access_control:

  status: "DRAFT — confirm with SM / Management"

  roles:
    - "AE"
    - "SM"
    - "Management"
    - "Admin"

  scope:
    AE: "own"
    SM: "region"
    Management: "region"
    Admin: "all"

  # Admin may preview the app as another user (Demo As).
  # The backend then applies the demo user's role and scope.
  demo_as_allowed_for:
    - "Admin"

  # Only sheets listed under files.<file>.sheets are reachable from the app.
  # Documentation tabs in the source files are never read or written.
  excluded_sheets:
    - "README"
    - "Data_Dictionary"

  # Deleting a master row is refused while other rows still reference its ID
  # (per referenced_by / used_by above) — deactivate it instead.
  files:

    "B2B_GEO_User_Org_Master.xlsx":
      sheets:
        Users:
          entity: "users"
          primary_key: "user_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        User_Region:
          entity: "user_regions"
          primary_key: "user_region_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Regions:
          entity: "regions"
          primary_key: "region_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Territories:
          entity: "territories"
          primary_key: "territory_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]

    "B2B_Product_Master.xlsx":
      sheets:
        Product_Categories:
          entity: "product_categories"
          primary_key: "category_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Products:
          entity: "products"
          primary_key: "product_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]

    "B2B_GEO_Pipeline_Config.xlsx":
      sheets:
        Stages:
          entity: "stages"
          primary_key: "stage_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Scenarios:
          entity: "scenarios"
          primary_key: "scenario_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Lost_Reasons:
          entity: "lost_reasons"
          primary_key: "reason_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Working_With:
          entity: "working_with_options"
          primary_key: "team_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Support_Types:
          entity: "support_types"
          primary_key: "support_type_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Aging_Settings:
          entity: "pipeline_settings"
          primary_key: "setting_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]

    # Application database for live data (not a source file).
    # Locally: data/B2B_GEO_Pipeline_DB.xlsx. Later: a Google Sheet.
    "B2B_GEO_Pipeline_DB.xlsx":
      sheets:
        Opportunities:
          entity: "opportunities"
          primary_key: "opportunity_id"
          scoped: true
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["AE", "SM", "Admin"]
            update: ["AE", "SM", "Admin"]
            delete: []
            import: ["SM", "Admin"]
            export: ["SM", "Management", "Admin"]
        Opportunity_Events:
          entity: "opportunity_events"
          primary_key: "event_id"
          scoped: true
          append_only: true
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["AE", "SM", "Admin"]
            update: []
            delete: []
            export: ["SM", "Management", "Admin"]
        Monthly_Snapshots:
          entity: "monthly_snapshots"
          primary_key: "snapshot_id"
          scoped: true
          permissions:
            read: ["SM", "Management", "Admin"]
            create: ["Admin"]
            update: []
            delete: ["Admin"]
            export: ["SM", "Management", "Admin"]

    "B2B_GEO_Pipeline_Import.xlsx":
      upload_only: true
      permissions:
        import: ["SM", "Admin"]

    # Output files: written by the backend after each action, never read back
    # as data. Sheets not listed under `output` (README, Data_Dictionary,
    # Event_Type_Reference …) are never touched.
    #   mode replace — sheet rewritten from the Application Database
    #   mode append  — one row added per event (audit trail)
    #   mode cells   — only fixed cells are set (formula layout)

    "B2B_GEO_Current_Pipeline_Export_Template.xlsx":
      output_only: true
      permissions:
        export: ["SM", "Management", "Admin"]
      output:
        Current_Pipeline_Export:
          mode: "replace"
          when: "Any Opportunity create / update / delete"

    "B2B_GEO_Change_Log_Export_Template.xlsx":
      output_only: true
      permissions:
        export: ["SM", "Management", "Admin"]
      output:
        Change_Log_Export:
          mode: "append"
          when: "Every Opportunity event (by AE / SM / Admin) and every master-data change (MASTER_CREATED / MASTER_UPDATED / MASTER_DELETED)"

    "B2B_GEO_Month_End_Export_Template.xlsx":
      output_only: true
      permissions:
        export: ["SM", "Management", "Admin"]
      output:
        Open_Pipeline_Snapshot:
          mode: "replace"
          when: "Admin captures a month-end snapshot (latest captured month)"
        Closed_Won:
          mode: "replace"
          when: "Admin captures a month-end snapshot — Won in that month"
        Closed_Lost:
          mode: "replace"
          when: "Admin captures a month-end snapshot — Lost in that month"
        Summary:
          mode: "cells"
          cells: ["B3 = Reporting Month", "B5 = Generated At"]

