export_03_month_end:

  file:
    name: "B2B_GEO_Month_End_Export_Template.xlsx"

  purpose:
    - "Monthly management review"
    - "Historical forecasting"
    - "Forecast vs Actual"
    - "Pipeline Slippage Analysis"

  sheets:

    Summary:

      source:
        - "opportunities"
        - "monthly_snapshots"
        - "products"
        - "product_categories"
        - "lost_reasons"

      metrics:

        open_pipeline:
          source: "monthly_snapshots"
          condition: "status = Open"

        expected_close:
          source: "monthly_snapshots"
          condition:
            "expected_close_month = reporting_month"

        won:
          source: "opportunities"
          condition:
            "won_month = reporting_month"

        lost:
          source: "opportunities"
          condition:
            "lost_month = reporting_month"

        pipeline_created:
          source: "opportunities.created_at"
          condition:
            "created_month = reporting_month"

        support_needed:
          source: "monthly_snapshots"
          condition:
            "support_needed = true"

        stuck_pipeline:
          source: "monthly_snapshots"
          condition:
            "stage_aging > configured threshold"

        product_category_summary:
          group_by:
            "Product Category"

          outputs:
            - "Open Opportunity Count"
            - "Pipeline Value"

        lost_reason_summary:
          group_by:
            "Lost Reason"

          outputs:
            - "Lost Count"
            - "Lost Value"


    Closed_Won:

      source:
        "opportunities"

      filter:
        - "status = Won"
        - "won_month = reporting_month"

      grain:
        "1 row = 1 Won Opportunity"


    Closed_Lost:

      source:
        "opportunities"

      filter:
        - "status = Lost"
        - "lost_month = reporting_month"

      joins:
        - "lost_reasons"

      grain:
        "1 row = 1 Lost Opportunity"


    Open_Pipeline_Snapshot:

      source:
        "monthly_snapshots"

      filter:
        "snapshot_month = reporting_month"

      grain:
        "1 row = 1 Open Opportunity at Month-End"

      purpose:
        - "Preserve what the Pipeline looked like at that point in time."


