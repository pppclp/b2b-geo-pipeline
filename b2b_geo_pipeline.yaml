# ============================================================
# 11. EXPORT TEMPLATE 03
# MONTH-END EXPORT
# ============================================================

export_03_month_end:

  file:
    name: "B2B_GEO_Month_End_Export_Template.xlsx"

  purpose:
    - "Monthly management review"
    - "Historical forecasting"
    - "Forecast vs Actual"
    - "Pipeline Slippage Analysis"

  sheets:

    Summary:

      source:
        - "opportunities"
        - "monthly_snapshots"
        - "product_categories"
        - "lost_reasons"

      metrics:

        open_pipeline:
          source: "monthly_snapshots"
          condition: "status = Open"

        expected_close:
          source: "monthly_snapshots"
          condition:
            "expected_close_month = reporting_month"

        won:
          source: "opportunities"
          condition:
            "won_month = reporting_month"

        lost:
          source: "opportunities"
          condition:
            "lost_month = reporting_month"

        pipeline_created:
          source: "opportunities.created_at"
          condition:
            "created_month = reporting_month"

        support_needed:
          source: "monthly_snapshots"
          condition:
            "support_needed = true"

        stuck_pipeline:
          source: "monthly_snapshots"
          condition:
            "stage_aging > configured threshold"

        product_category_summary:
          group_by:
            "Product Category"

          outputs:
            - "Open Opportunity Count"
            - "Pipeline Value"

        lost_reason_summary:
          group_by:
            "Lost Reason"

          outputs:
            - "Lost Count"
            - "Lost Value"


    Closed_Won:

      source:
        "opportunities"

      filter:
        - "status = Won"
        - "won_month = reporting_month"

      grain:
        "1 row = 1 Won Opportunity"


    Closed_Lost:

      source:
        "opportunities"

      filter:
        - "status = Lost"
        - "lost_month = reporting_month"

      joins:
        - "lost_reasons"

      grain:
        "1 row = 1 Lost Opportunity"


    Open_Pipeline_Snapshot:

      source:
        "monthly_snapshots"

      filter:
        "snapshot_period = reporting_month"

      grain:
        "1 row = 1 Pipeline per Snapshot Period"

      purpose:
        - "Preserve the Pipeline state for analysis / commission at that capture period."
        - "Store only the latest Stage at capture time; Stage history remains in Pipeline_Events."


# ============================================================
# 12. SNAPSHOT ENTITY
# ============================================================

monthly_snapshots:

  source:
    "Current Pipeline state at controlled snapshot capture"

  generated_by:
    "System / Controlled Snapshot process"

  grain:
    "1 row = 1 Pipeline × 1 snapshot_period"

  fields:

    snapshot_id:
      generated: true

    snapshot_period:
      format: "YYYY-MM"
      description: "Reporting / commission period."

    captured_at:
      source: "SYSTEM"
      description: "Timestamp when the snapshot period was captured."

    opportunity_id:
      foreign_key: "opportunities.opportunity_id"

    lead_created_at:
      snapshot_of:
        "opportunities.created_at"

    owner_user_id:
      snapshot_of:
        "opportunities.owner_user_id"

    current_handler_user_id:
      snapshot_of:
        "opportunities.current_handler_user_id"

    region_id:
      snapshot_of:
        "opportunities.region_id"

    territory_id:
      snapshot_of:
        "opportunities.territory_id"

    sales_channel:
      snapshot_of:
        "opportunities.sales_channel"

    partner_name:
      snapshot_of:
        "opportunities.partner_name"

    business_id:
      snapshot_of:
        "opportunities.business_id"

    customer_name:
      snapshot_of:
        "opportunities.customer_name"

    customer_type:
      snapshot_of:
        "opportunities.customer_type"

    contact_name:
      snapshot_of:
        "opportunities.contact_name"

    contact_phone:
      snapshot_of:
        "opportunities.contact_phone"

    remark:
      snapshot_of:
        "opportunities.remark"

    product_category_id:
      snapshot_of:
        "opportunities.product_category_id"

    product_details:
      snapshot_of:
        "opportunities.product_details"

    quantity:
      snapshot_of:
        "opportunities.quantity"

    price_per_sub:
      snapshot_of:
        "opportunities.price_per_sub"

    pipeline_value:
      snapshot_of:
        "opportunities.pipeline_value"
      description: "Net RC at capture time."

    oc:
      snapshot_of:
        "opportunities.oc"

    contract_period_months:
      snapshot_of:
        "opportunities.contract_period_months"

    contract_value:
      source: "CALCULATED AT SNAPSHOT"
      formula: "pipeline_value * contract_period_months"

    expected_close_month:
      snapshot_of:
        "opportunities.expected_close_month"

    ccp_check_result:
      snapshot_of:
        "opportunities.ccp_check_result"

    scenario_id:
      snapshot_of:
        "opportunities.scenario_id"

    handoff_at:
      snapshot_of:
        "opportunities.handler_since"
      condition:
        "current_handler_user_id != owner_user_id"

    stage_id:
      snapshot_of:
        "opportunities.stage_id"
      description: "LATEST Stage only at snapshot capture."

    stage_last_updated_at:
      snapshot_of:
        "opportunities.stage_entered_at"
      description: "Timestamp the latest Stage was entered."

    status:
      snapshot_of:
        "opportunities.status"

    support_needed:
      snapshot_of:
        "opportunities.support_needed"

    support_type_id:
      snapshot_of:
        "opportunities.support_type_id"

    support_note:
      snapshot_of:
        "opportunities.support_note"

    won_at:
      snapshot_of:
        "opportunities.won_at"

    lost_at:
      snapshot_of:
        "opportunities.lost_at"

    lost_reason_id:
      snapshot_of:
        "opportunities.lost_reason_id"

    # Import-friendly evidence is appended to the existing 38-column schema.
    # Original month and source amounts are copied, not recomputed from present state.
    created_month:
      snapshot_of: "opportunities.created_month"
    owner_sales_code:
      source: "Users.employee_id for opportunities.owner_user_id, frozen at capture"
    owner_sale_name:
      source: "Users.display_name for opportunities.owner_user_id, frozen at capture"
    customer_location_text:
      snapshot_of: "opportunities.customer_location_text"
    import_source_customer_type:
      snapshot_of: "opportunities.import_source_customer_type"
    import_source_rc:
      snapshot_of: "opportunities.import_source_rc"
      description: "Original legacy RC. Blank for non-imported Pipelines."
    import_source_net_rc:
      snapshot_of: "opportunities.import_source_net_rc"
      description: "Original source Net RC; may differ from calculated pipeline_value at capture."
    import_source_monthly_sale_plan:
      snapshot_of: "opportunities.import_source_monthly_sale_plan"
      description: "Original Monthly Sale Plan, distinct from expected_close_month."
    import_source_system:
      snapshot_of: "opportunities.import_source_system"
    import_source_record_id:
      snapshot_of: "opportunities.import_source_record_id"
    import_batch_id:
      snapshot_of: "opportunities.import_batch_id"

  capture_rules:
    - "Only one persisted row per opportunity_id + snapshot_period."
    - "Re-capturing the same snapshot_period replaces that period instead of appending duplicates."
    - "Stage history is NOT duplicated here; Pipeline_Events is the audit trail."
    - "Historical snapshot rows must not automatically change when current Pipeline changes later."
    - "Do not backfill past snapshot periods using current Pipeline values; additional columns stay blank in historical captures."


