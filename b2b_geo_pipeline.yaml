# ============================================================
# 17. ACCESS CONTROL (RUNTIME)
# The backend (local dev server now, Apps Script later) reads this
# section to decide which Excel / Google Sheet file + sheet backs each
# entity and which role may do what. Edit here — not in code.
#
# actions:
#   read    — list / get rows
#   create  — add rows
#   update  — edit rows
#   delete  — remove rows (master data should be deactivated instead)
#   import  — bulk import into the sheet
#   export  — download as Excel
#
# scope (opportunity-like sheets only):
#   all     — every row
#   region  — rows whose region_id is in the user's active User_Region rows
#             (Management with no active User_Region rows = no access;
#              nationwide view requires explicit assignments to all Region IDs)
#   own     — rows where owner_user_id or current_handler_user_id = user
# ============================================================

access_control:

  status: "DRAFT — confirm with SM / Management"

  roles:
    - "AE"
    - "SM"
    - "Management"
    - "Admin"

  scope:
    AE: "own"
    SM: "region"
    Management: "region"
    Admin: "all"

  # Admin may preview the app as another user (Demo As).
  # The backend then applies the demo user's role and scope.
  demo_as_allowed_for:
    - "Admin"

  # Only sheets listed under files.<file>.sheets are reachable from the app.
  # Documentation tabs in the source files are never read or written.
  excluded_sheets:
    - "README"
    - "Data_Dictionary"

  # Deleting a master row is refused while other rows still reference its ID
  # (per referenced_by / used_by above) — deactivate it instead.
  files:

    "B2B_GEO_UAT_Credentials_Distribution.xlsx":
      sheets:
        UAT_Credentials:
          entity: "uat_credentials"
          primary_key: "user_id"
          permissions:
            read: []
            create: []
            update: []
            delete: []

    "B2B_GEO_User_Org_Master.xlsx":
      sheets:
        Users:
          entity: "users"
          primary_key: "user_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        User_Region:
          entity: "user_regions"
          primary_key: "user_region_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Regions:
          entity: "regions"
          primary_key: "region_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Territories:
          entity: "territories"
          primary_key: "territory_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]

    "B2B_GEO_Pipeline_Config.xlsx":
      sheets:
        Scenario_Tasks:
          entity: "scenario_tasks"
          primary_key: "task_id"
          permissions:
            read: []
            create: []
            update: []
            delete: []
        Product_Categories:
          entity: "product_categories"
          primary_key: "category_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Stages:
          entity: "stages"
          primary_key: "stage_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Scenarios:
          entity: "scenarios"
          primary_key: "scenario_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Lost_Reasons:
          entity: "lost_reasons"
          primary_key: "reason_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Working_With:
          entity: "working_with_options"
          primary_key: "team_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Support_Types:
          entity: "support_types"
          primary_key: "support_type_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]
        Aging_Settings:
          entity: "pipeline_settings"
          primary_key: "setting_id"
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["Admin"]
            update: ["Admin"]
            delete: ["Admin"]

    # Canonical application database; no mirrored runtime Export Template files.
    # Phase 4 adds Handoff_Notifications and Support_Requests via an explicitly approved migration.
    # Locally: data/B2B_GEO_Pipeline_DB.xlsx; UAT: the existing Google Sheet.
    "B2B_GEO_Pipeline_DB.xlsx":
      sheets:
        Pipelines:
          entity: "opportunities"
          primary_key: "opportunity_id"
          scoped: true
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            create: ["AE", "SM", "Management", "Admin"]
            update: ["AE", "SM", "Management", "Admin"]
            delete: []
            import: ["SM", "Admin"]
            export: ["AE", "SM", "Management", "Admin"]
        Pipeline_Tasks:
          entity: "pipeline_tasks"
          primary_key: "task_instance_id"
          permissions:
            read: []
            create: []
            update: []
            delete: []
        Pipeline_Events:
          entity: "opportunity_events"
          primary_key: "event_id"
          scoped: true
          append_only: true
          permissions:
            read: ["AE", "SM", "Management", "Admin"]
            # Backend-managed only. No browser may forge its own audit event.
            create: []
            update: []
            delete: []
            export: ["AE", "SM", "Management", "Admin"]
        Snapshots:
          entity: "monthly_snapshots"
          primary_key: "snapshot_id"
          scoped: true
          permissions:
            read: ["SM", "Management", "Admin"]
            # Snapshot mutations use POST /snapshots/capture only; the backend
            # authorizes Admin and validates/backs up the replacement.
            create: ["Admin"]
            update: []
            delete: []
            export: ["SM", "Management", "Admin"]
        Handoff_Notifications:
          entity: "handoff_notifications"
          primary_key: "notification_id"
          permissions:
            read: []
            create: []
            update: []
            delete: []
        Support_Requests:
          entity: "support_requests"
          primary_key: "request_id"
          permissions:
            read: []
            create: []
            update: []
            delete: []
        Admin_Audit:
          entity: "admin_audit"
          primary_key: "audit_id"
          append_only: true
          permissions:
            read: ["Admin"]
            # Written internally by the backend on Master create/update/delete.
            create: []
            update: []
            delete: []
            export: ["Admin"]

    "B2B_GEO_Pipeline_Import.xlsx":
      upload_only: true
      permissions:
        import: ["SM", "Admin"]

    # Legacy standalone Current/Change_Log/Month_End Export spreadsheets
    # are intentionally NOT runtime dependencies. Data exports must be built
    # on demand from Pipelines, Pipeline_Events, Snapshots and Admin_Audit.
    # Keep historical templates archived until the migration is verified.

# ============================================================
# END OF ACCESS CONTROL
# ============================================================
